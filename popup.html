<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Looper - A-B Repeat & Save Segments</title>
    <style>
      :root {
        --bg: #141418;
        --card: rgba(20, 20, 24, 0.96);
        --panel: rgba(255, 255, 255, 0.04);
        --panel-hover: rgba(255, 255, 255, 0.07);
        --panel-strong: rgba(255, 255, 255, 0.09);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.12);
        --text: #f5f5f7;
        --muted: #a1a1aa;
        --soft: #71717a;
        --accent: #7c8cff;
        --accent-soft: rgba(124, 140, 255, 0.14);
        --loop: rgba(52, 211, 153, 0.18);
        --loop-border: rgba(52, 211, 153, 0.3);
        --loop-text: #d1fae5;
        --save: rgba(251, 191, 36, 0.18);
        --save-border: rgba(251, 191, 36, 0.3);
        --save-text: #fef3c7;
        --danger: rgba(255, 107, 107, 0.18);
        --danger-border: rgba(255, 107, 107, 0.3);
        --shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 332px;
        font-family: "SF Pro Display", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(124, 140, 255, 0.14), transparent 38%),
          radial-gradient(circle at bottom right, rgba(244, 114, 182, 0.12), transparent 34%),
          linear-gradient(180deg, #111216 0%, #181a20 100%);
        color: var(--text);
      }

      .shell {
        padding: 16px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px;
        background: var(--card);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #c7d2fe;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .lead {
        display: none;
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
      }

      .quick-list {
        display: none;
        gap: 8px;
        margin: 14px 0 16px;
        padding: 0;
        list-style: none;
      }

      .quick-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted);
      }

      .quick-dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: linear-gradient(90deg, #7c8cff 0%, #f472b6 100%);
      }

      .action-grid {
        display: grid;
        gap: 10px;
      }

      button,
      .web-link,
      select {
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        transition:
          transform 0.15s ease,
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease,
          box-shadow 0.15s ease;
      }

      button,
      select {
        width: 100%;
      }

      button {
        padding: 11px 14px;
        cursor: pointer;
      }

      button:hover,
      .web-link:hover,
      select:hover {
        transform: translateY(-1px);
      }

      .btn-loop {
        border: 1px solid var(--loop-border);
        background: var(--loop);
        color: var(--loop-text);
        box-shadow: none;
      }

      .btn-loop:hover {
        background: rgba(52, 211, 153, 0.28);
        border-color: rgba(52, 211, 153, 0.4);
      }

      .web-link {
        display: block;
        width: 100%;
        padding: 11px 14px;
        text-align: center;
        text-decoration: none;
        border: 1px solid var(--save-border);
        background: var(--save);
        color: var(--save-text);
      }

      .web-link:hover {
        background: rgba(251, 191, 36, 0.28);
        border-color: rgba(251, 191, 36, 0.4);
      }

      .sync-note {
        margin: 12px 0 0;
        font-size: 11px;
        color: var(--soft);
        text-align: center;
      }

      .shortcut-card {
        margin-top: 14px;
        padding: 14px;
        border-radius: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
      }

      .shortcut-label {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 700;
        color: #c7d2fe;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .shortcut-desc,
      .shortcut-copy,
      .shortcut-meta,
      .shortcut-status {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }

      .shortcut-desc {
        margin-bottom: 12px;
      }

      .shortcut-list {
        display: grid;
        gap: 10px;
      }

      .shortcut-row {
        display: grid;
        grid-template-columns: 1fr 68px;
        align-items: center;
        gap: 10px;
      }

      .shortcut-name {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
      }

      .shortcut-select {
        padding: 7px 10px;
        border: 1px solid var(--border-strong);
        background: var(--panel-strong);
        color: var(--text);
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, #c7d2fe 50%),
          linear-gradient(135deg, #c7d2fe 50%, transparent 50%);
        background-position:
          calc(100% - 16px) calc(50% - 2px),
          calc(100% - 11px) calc(50% - 2px);
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        padding-right: 26px;
        font-size: 12px;
      }

      .shortcut-select:focus {
        outline: none;
        border-color: rgba(124, 140, 255, 0.45);
        box-shadow: 0 0 0 3px rgba(124, 140, 255, 0.16);
      }

      .shortcut-loop-all {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .shortcut-meta {
        margin-top: 4px;
        font-size: 11px;
      }

      .shortcut-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
      }

      .shortcut-status {
        flex: 1;
        font-size: 11px;
      }

      .shortcut-status[data-tone="success"] {
        color: #86efac;
      }

      .shortcut-reset-btn {
        width: auto;
        padding: 9px 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        box-shadow: none;
      }

      .shortcut-reset-btn:hover {
        background: var(--panel-hover);
        border-color: var(--border-strong);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="badge">AB Loop</div>
        <p id="popup-desc" class="lead"></p>

        <ul class="quick-list">
          <li id="popup-quick-1" class="quick-item"><span class="quick-dot"></span><span></span></li>
          <li id="popup-quick-2" class="quick-item"><span class="quick-dot"></span><span></span></li>
        </ul>

        <div class="action-grid">
          <button id="open-youtube" class="btn-loop" type="button"></button>
          <a id="open-web" class="web-link" href="https://youtube-looper.vercel.app/" target="_blank"></a>
        </div>

        <p id="popup-sync-note" class="sync-note"></p>

        <div class="shortcut-card">
          <p id="popup-shortcut-label" class="shortcut-label"></p>
          <p id="popup-shortcut-desc" class="shortcut-desc"></p>
          <div id="popup-shortcut-list" class="shortcut-list"></div>
          <div class="shortcut-loop-all">
            <p id="popup-shortcut-loop-all" class="shortcut-copy"></p>
            <p id="popup-shortcut-meta" class="shortcut-meta"></p>
          </div>
          <div class="shortcut-footer">
            <p id="popup-shortcut-status" class="shortcut-status"></p>
            <button id="popup-shortcut-reset" class="shortcut-reset-btn" type="button"></button>
          </div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
